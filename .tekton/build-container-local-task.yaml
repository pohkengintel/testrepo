apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-container-local
spec:
  description: 'Buildah task builds source code into a container image and pushes the image into container registry using buildah tool.

    In addition, it generates a SBOM file, injects the SBOM file into final container image and pushes the SBOM file as separate image using cosign tool.

    When prefetch-dependencies task is activated it is using its artifacts to run build in hermetic environment.'
  params:
  - default: activation-key
    description: Name of secret which contains subscription activation key
    name: ACTIVATION_KEY
    type: string
  - default: []
    description: Additional base image references to include to the SBOM. Array of image_reference_with_digest strings
    name: ADDITIONAL_BASE_IMAGES
    type: array
  - default: does-not-exist
    description: Name of a secret which will be made available to the build with 'buildah build --secret' at /run/secrets/$ADDITIONAL_SECRET
    name: ADDITIONAL_SECRET
    type: string
  - default: ''
    description: Comma separated list of extra capabilities to add when running 'buildah build'
    name: ADD_CAPABILITIES
    type: string
  - default: 'false'
    description: Allows to use parent images that don't match the build host architecture. This option must be used with caution as it may create incompatible images.
    name: ALLOW_CROSS_PLATFORM_IMAGES
    type: string
  - default: []
    description: Additional key=value annotations that should be applied to the image
    name: ANNOTATIONS
    type: array
  - default: ''
    description: Path to a file with additional key=value annotations that should be applied to the image
    name: ANNOTATIONS_FILE
    type: string
  - default: oci
    description: The format for the resulting image's mediaType. Valid values are oci (default) or docker.
    name: BUILDAH_FORMAT
    type: string
  - default: []
    description: Array of --build-arg values ("arg=value" strings)
    name: BUILD_ARGS
    type: array
  - default: ''
    description: Path to a file with build arguments, see https://www.mankier.com/1/buildah-build#--build-arg-file
    name: BUILD_ARGS_FILE
    type: string
  - default: ''
    description: Defines the single build time for all buildah builds in seconds since UNIX epoch. Conflicts with SOURCE_DATE_EPOCH.
    name: BUILD_TIMESTAMP
    type: string
  - default: ''
    description: The Trusted Artifact URI pointing to the artifact with the prefetched dependencies.
    name: CACHI2_ARTIFACT
    type: string
  - default: ''
    description: The image is built from this commit.
    name: COMMIT_SHA
    type: string
  - default: .
    description: Path to the directory to use as context.
    name: CONTEXT
    type: string
  - default: 'true'
    description: Determines if SBOM will be contextualized.
    name: CONTEXTUALIZE_SBOM
    type: string
  - default: ./Dockerfile
    description: Path to the Dockerfile to build.
    name: DOCKERFILE
    type: string
  - default: etc-pki-entitlement
    description: Name of secret which contains the entitlement certificates
    name: ENTITLEMENT_SECRET
    type: string
  - default: []
    description: Array of --env values ("env=value" strings)
    name: ENV_VARS
    type: array
  - default: 'false'
    description: Determines if build will be executed without network access.
    name: HERMETIC
    type: string
  - default: ''
    description: HTTP/HTTPS proxy to use for the buildah pull and build operations. Will not be passed through to the container during the build process.
    name: HTTP_PROXY
    type: string
  - default: 'true'
    description: Whether to keep compatibility location at /root/buildinfo/ for ICM injection
    name: ICM_KEEP_COMPAT_LOCATION
    type: string
  - description: Reference of the image buildah will produce.
    name: IMAGE
    type: string
  - default: ''
    description: Delete image tag after specified time. Empty means to keep the image tag. Time values could be something like 1h, 2d, 3w for hours, days, and weeks, respectively.
    name: IMAGE_EXPIRES_AFTER
    type: string
  - default: 'true'
    description: Determines if the image inherits the base image labels.
    name: INHERIT_BASE_IMAGE_LABELS
    type: string
  - default: []
    description: Additional key=value labels that should be applied to the image
    name: LABELS
    type: array
  - default: info
    description: Log level for the build command.
    name: LOG_LEVEL
    type: string
  - default: ''
    description: Comma separated list of hosts or domains which should bypass the HTTP/HTTPS proxy.
    name: NO_PROXY
    type: string
  - default: 'false'
    description: Omit build history information from the resulting image. Improves reproducibility by excluding timestamps and layer metadata.
    name: OMIT_HISTORY
    type: string
  - default: ''
    description: In case it is not empty, the prefetched content should be made available to the build.
    name: PREFETCH_INPUT
    type: string
  - default: 'false'
    description: Whether to enable privileged mode, should be used only with remote VMs
    name: PRIVILEGED_NESTED
    type: string
  - default: ca-bundle.crt
    description: The name of the key in the ConfigMap that contains the proxy CA bundle data.
    name: PROXY_CA_TRUST_CONFIG_MAP_KEY
    type: string
  - default: caching-ca-bundle
    description: The name of the ConfigMap to read proxy CA bundle data from.
    name: PROXY_CA_TRUST_CONFIG_MAP_NAME
    type: string
  - default: 'false'
    description: Clamp mtime of all files to at most SOURCE_DATE_EPOCH. Does nothing if SOURCE_DATE_EPOCH is not defined.
    name: REWRITE_TIMESTAMP
    type: string
  - default: auto
    description: Mount /etc/rhsm/ca from the host machine into the build. Valid values are 'always', 'auto' (default), 'never'. Only effective if HERMETIC=false and ACTIVATION_KEY or ENTITLEMENT_SECRET is set.
    name: RHSM_MOUNT_CA_CERTS
    type: string
  - default: 'true'
    description: Flag to enable or disable SBOM validation before save. Validation is optional - use this if you are experiencing performance issues.
    name: SBOM_SKIP_VALIDATION
    type: string
  - default: 'true'
    description: Flag to enable or disable SBOM generation from source code. The scanner of the source code is enabled only for non-hermetic builds and can be disabled if the SBOM_SYFT_SELECT_CATALOGERS can't turn off catalogers that cause false positives on source code scanning.
    name: SBOM_SOURCE_SCAN_ENABLED
    type: string
  - default: ''
    description: 'Extra option to customize Syft''s default catalogers when generating SBOMs. The value corresponds to Syft''s CLI flag --select-catalogers. The details about available catalogers can be found here: https://github.com/anchore/syft/wiki/Package-Cataloger-Selection'
    name: SBOM_SYFT_SELECT_CATALOGERS
    type: string
  - default: spdx
    description: 'Select the SBOM format to generate. Valid values: spdx, cyclonedx. Note: the SBOM from the prefetch task - if there is one - must be in the same format.'
    name: SBOM_TYPE
    type: string
  - default: 'false'
    description: Don't inject a content-sets.json or a labels.json file. This requires that the canonical Containerfile takes care of this itself.
    name: SKIP_INJECTIONS
    type: string
  - default: 'false'
    description: Skip SBOM-related operations. This will likely cause EC policies to fail if enabled
    name: SKIP_SBOM_GENERATION
    type: string
  - default: 'true'
    description: Whether to skip stages in Containerfile that seem unused by subsequent stages
    name: SKIP_UNUSED_STAGES
    type: string
  - description: The Trusted Artifact URI pointing to the artifact with the application source code.
    name: SOURCE_ARTIFACT
    type: string
  - default: ''
    description: Timestamp in seconds since Unix epoch for reproducible builds. Sets image created time and SOURCE_DATE_EPOCH build arg. Conflicts with BUILD_TIMESTAMP.
    name: SOURCE_DATE_EPOCH
    type: string
  - default: ''
    description: The image is built from this URL.
    name: SOURCE_URL
    type: string
  - default: 'false'
    description: Squash all new and previous layers added as a part of this build, as per --squash
    name: SQUASH
    type: string
  - default: overlay
    description: Storage driver to configure for buildah
    name: STORAGE_DRIVER
    type: string
  - default: ''
    description: Target stage in Dockerfile to build. If not specified, the Dockerfile is processed entirely to (and including) its last stage.
    name: TARGET_STAGE
    type: string
  - default: 'true'
    description: Verify the TLS on the registry endpoint (for push/pull to a non-TLS registry)
    name: TLSVERIFY
    type: string
  - default: ''
    description: Mount the current working directory into the build using --volume $PWD:/$WORKINGDIR_MOUNT. Note that the $PWD will be the context directory for the build (see the CONTEXT param).
    name: WORKINGDIR_MOUNT
    type: string
  - default: fetched.repos.d
    description: Path in source workspace where dynamically-fetched repos are present
    name: YUM_REPOS_D_FETCHED
    type: string
  - default: repos.d
    description: Path in the git repository in which yum repository files are stored
    name: YUM_REPOS_D_SRC
    type: string
  - default: /etc/yum.repos.d
    description: Target path on the container in which yum repository files should be made available
    name: YUM_REPOS_D_TARGET
    type: string
  - default: ca-bundle.crt
    description: The name of the key in the ConfigMap that contains the CA bundle data.
    name: caTrustConfigMapKey
    type: string
  - default: trusted-ca
    description: The name of the ConfigMap to read CA bundle data from.
    name: caTrustConfigMapName
    type: string
  results:
  - description: Digest of the image just built
    name: IMAGE_DIGEST
    type: string
  - description: Image reference of the built image
    name: IMAGE_REF
    type: string
  - description: Image repository and tag where the built image was pushed
    name: IMAGE_URL
    type: string
  - description: Reference of SBOM blob digest to enable digest-based verification from provenance
    name: SBOM_BLOB_URL
    type: string
  stepTemplate:
    computeResources:
      limits:
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 256Mi
    env:
    - name: ADDITIONAL_SECRET
      value: does-not-exist
    - name: ADD_CAPABILITIES
    - name: ALLOW_CROSS_PLATFORM_IMAGES
      value: 'false'
    - name: ANNOTATIONS_FILE
    - name: BUILD_ARGS_FILE
    - name: BUILD_TIMESTAMP
    - name: CONTEXT
      value: .
    - name: CONTEXTUALIZE_SBOM
      value: 'true'
    - name: HERMETIC
      value: 'false'
    - name: IMAGE
      value: registry-service.kind-registry/testrepo:on-pr-2ce326db41efad0d3c88d5e7f499198f2173ada1
    - name: IMAGE_EXPIRES_AFTER
      value: 5d
    - name: INHERIT_BASE_IMAGE_LABELS
      value: 'true'
    - name: KBC_LOG_LEVEL
      value: info
    - name: PRIVILEGED_NESTED
      value: 'false'
    - name: RHSM_MOUNT_CA_CERTS
      value: auto
    - name: SBOM_SKIP_VALIDATION
      value: 'true'
    - name: SBOM_SOURCE_SCAN_ENABLED
      value: 'true'
    - name: SBOM_SYFT_SELECT_CATALOGERS
    - name: SBOM_TYPE
      value: spdx
    - name: SKIP_INJECTIONS
      value: 'false'
    - name: SKIP_SBOM_GENERATION
      value: 'false'
    - name: SKIP_UNUSED_STAGES
      value: 'true'
    - name: SOURCE_CODE_DIR
      value: source
    - name: SQUASH
      value: 'false'
    - name: STORAGE_DRIVER
      value: overlay
    - name: TARGET_STAGE
    - name: TLSVERIFY
      value: 'true'
    - name: WORKINGDIR_MOUNT
    - name: YUM_REPOS_D_FETCHED
      value: fetched.repos.d
    - name: YUM_REPOS_D_SRC
      value: repos.d
    - name: YUM_REPOS_D_TARGET
      value: /etc/yum.repos.d
    imagePullPolicy: IfNotPresent
    volumeMounts:
    - mountPath: /shared
      name: shared
    - mountPath: /var/workdir
      name: workdir
  steps:
  - args:
    - use
    - oci:registry-service.kind-registry/testrepo@sha256:18e9cbb1623483eef10cf1fac409debd8ae93c66bf0414a3b03969fd1e7ef7a1=/var/workdir/source
    - =/var/workdir/cachi2
    computeResources: {}
    image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:7c51a3530f239323442e28ea7dace8b88a14638d823d5eaa8514843c33b03c02
    name: use-trusted-artifact
    volumeMounts:
    - mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
      name: trusted-ca
      readOnly: true
      subPath: ca-bundle.crt
  - args:
    - --build-args
    - --envs
    - --labels
    - --annotations
    computeResources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 1Gi
    env:
    - name: HOME
      value: /root
    - name: COMMIT_SHA
      value: 2ce326db41efad0d3c88d5e7f499198f2173ada1
    - name: SOURCE_URL
      value: https://github.com/pohkengintel/testrepo
    - name: DOCKERFILE
      value: Dockerfile
    - name: BUILDAH_HTTP_PROXY
    - name: BUILDAH_NO_PROXY
    - name: ICM_KEEP_COMPAT_LOCATION
      value: 'true'
    - name: BUILDAH_OMIT_HISTORY
      value: 'false'
    - name: BUILDAH_SOURCE_DATE_EPOCH
    - name: BUILDAH_REWRITE_TIMESTAMP
      value: 'false'
    image: quay.io/konflux-ci/konflux-build-cli:latest@sha256:0415613f955ef8f7c6fc821a6738dcf062d9a3582441042b87a2391c375d7f54
    name: build
    script: "#!/bin/bash\nset -euo pipefail\n\nca_bundle=/mnt/trusted-ca/ca-bundle.crt\nproxy_ca_bundle=/mnt/proxy-ca-bundle/ca-bundle.crt\nupdate_ca_trust=false\n\nif [ -f \"$ca_bundle\" ]; then\n  echo \"[$(date --utc -Ins)] Using mounted CA bundle: $ca_bundle\"\n  cp -vf $ca_bundle /etc/pki/ca-trust/source/anchors/ca-bundle.crt\n  update_ca_trust=true\nfi\n\nif [ -f \"$proxy_ca_bundle\" ] && [ -n \"${BUILDAH_HTTP_PROXY}\" ]; then\n  echo \"[$(date --utc -Ins)] Using mounted proxy CA bundle: $proxy_ca_bundle\"\n  cp -vf $proxy_ca_bundle /etc/pki/ca-trust/source/anchors/proxy-ca-bundle.crt\n  update_ca_trust=true\nfi\n\nif [ \"$update_ca_trust\" = \"true\" ]; then\n  echo \"[$(date --utc -Ins)] Update CA trust\"\n  update-ca-trust\nfi\n\necho \"[$(date --utc -Ins)] Prepare system (architecture: $(uname -m))\"\n\n# Fixing group permission on /var/lib/containers\nchown root:root /var/lib/containers\n\nsed -i 's/^\\s*short-name-mode\\s*=\\s*.*/short-name-mode = \"disabled\"/' /etc/containers/registries.conf\n\n# Delete policy settings for Red Hat registries to disable signature verification.\n# TODO: don't do this?\ncontainer_policy=$(\n  jq '.transports |= (\n        del(.docker.[\"registry.access.redhat.com\"]) |\n        del(.docker.[\"registry.redhat.io\"]) |\n        if (.docker == {}) then del(.docker) else . end\n      )' /etc/containers/policy.json\n)\necho \"Effective container policy:\"\nprintf '%s\\n' \"$container_policy\" | tee /etc/containers/policy.json\n\n# Setting new namespace to run buildah - 2^32-2\necho 'root:1:4294967294' | tee -a /etc/subuid >>/etc/subgid\n\necho \"[$(date --utc -Ins)] Run the build\"\n\nif [ -e \"$SOURCE_CODE_DIR/$CONTEXT/$DOCKERFILE\" ]; then\n  dockerfile_path=\"$(pwd)/$SOURCE_CODE_DIR/$CONTEXT/$DOCKERFILE\"\nelif [ -e \"$SOURCE_CODE_DIR/$DOCKERFILE\" ]; then\n  dockerfile_path=\"$(pwd)/$SOURCE_CODE_DIR/$DOCKERFILE\"\nelse\n  echo \"Cannot find Dockerfile $DOCKERFILE\"\n  exit 1\nfi\n\nif [ -n \"${ANNOTATIONS_FILE}\" ] && [ -f \"${SOURCE_CODE_DIR}/${ANNOTATIONS_FILE}\" ]; then\n  ANNOTATIONS_FILE=$(realpath \"${SOURCE_CODE_DIR}/${ANNOTATIONS_FILE}\")\nfi\n\nif [ -n \"${BUILD_ARGS_FILE}\" ]; then\n  BUILD_ARGS_FILE=$(realpath \"${SOURCE_CODE_DIR}/${BUILD_ARGS_FILE}\")\nfi\n\n# Necessary for newer version of buildah if the host system does not contain up to date version of container-selinux\n# TODO remove the option once all hosts were updated\nsecurity_args=(--security-opts unmask=/proc/interrupts)\n\nif [ \"${PRIVILEGED_NESTED}\" == \"true\" ]; then\n  security_args+=(--security-opts label=disable)\n  security_args+=(--cap-add all)\n  security_args+=(--devices /dev/fuse)\nfi\nif [ -n \"${ADD_CAPABILITIES}\" ]; then\n  security_args+=(--cap-add \"${ADD_CAPABILITIES}\")\nfi\n\nif [ -f \"/var/workdir/cachi2/cachi2.env\" ]; then\n  prefetch_dir=\"/var/workdir/cachi2\"\n  # KBC defaults to ${prefetch_dir}/copy-*\n  # Copy to a sibling dir instead in case we don't have write permissions to the prefetch_dir.\n  # It's still on the same filesystem, so copying via reflinks should be possible.\n  prefetch_dir_copy=\"/var/workdir/prefetch-copy\"\nelse\n  prefetch_dir=\"\"\n  prefetch_dir_copy=\"\"\nfi\n\nyum_repos_d_sources=()\nif [ -d \"${YUM_REPOS_D_FETCHED}\" ]; then\n  yum_repos_d_sources+=(\"${YUM_REPOS_D_FETCHED}\")\nfi\nif [ -d \"${SOURCE_CODE_DIR}/${YUM_REPOS_D_SRC}\" ]; then\n  yum_repos_d_sources+=(\"${SOURCE_CODE_DIR}/${YUM_REPOS_D_SRC}\")\nfi\n\n# 0. if hermetic=true, skip all subscription related stuff\n# 1. do not enable activation key and entitlement at same time. If both are provided, prefer activation key.\n# 2. Activation-keys will be used when the key 'org' exists in the activation key secret.\n# 3. try to pre-register and mount files to the correct location so that users do no need to modify Dockerfiles.\n# 4. If the Dockerfile contains the string \"subcription-manager register\", add the activation-keys volume\n#    to buildah but don't pre-register for backwards compatibility. Mount an empty directory on\n#    to \"/etc/pki/entitlement\" to prevent certificates from being included\nrhsm_args=()\nif [ \"${HERMETIC}\" != \"true\" ]; then\n  if [ -e /activation-key/org ]; then\n    rhsm_args+=(--rhsm-activation-key=/activation-key/activationkey\n      --rhsm-org=/activation-key/org\n      --rhsm-activation-mount=/activation-key)\n\n    if ! grep -E \"^[^#]*subscription-manager.[^#]*register\" \"$dockerfile_path\"; then\n      # user is not running registration in the Containerfile: pre-register.\n      rhsm_args+=(--rhsm-activation-preregister)\n    fi\n  elif find /entitlement -name \"*.pem\" >/dev/null; then\n    rhsm_args+=(--rhsm-entitlements=/entitlement)\n  fi\nfi\nif [ \"${RHSM_MOUNT_CA_CERTS}\" != \"auto\" ]; then\n  rhsm_args+=(--rhsm-mount-ca-certs=\"$RHSM_MOUNT_CA_CERTS\")\nfi\n\n# Prevent ShellCheck from giving a warning because 'image' is defined and 'IMAGE' is not.\ndeclare IMAGE\n\ncmd=(\n  konflux-build-cli image build\n  -f \"$dockerfile_path\" -t \"$IMAGE\" --source \"$SOURCE_CODE_DIR\" --context \"$CONTEXT\"\n  --secret-dirs \"src=/additional-secret,name=$ADDITIONAL_SECRET,optional=true\"\n  --workdir-mount \"$WORKINGDIR_MOUNT\"\n  --target \"$TARGET_STAGE\"\n  --inherit-labels=\"$INHERIT_BASE_IMAGE_LABELS\"\n  --source-date-epoch \"$BUILDAH_SOURCE_DATE_EPOCH\"\n  --rewrite-timestamp=\"$BUILDAH_REWRITE_TIMESTAMP\"\n  --squash=\"$SQUASH\"\n  --omit-history=\"$BUILDAH_OMIT_HISTORY\"\n  --image-source \"$SOURCE_URL\"\n  --image-revision \"$COMMIT_SHA\"\n  --quay-image-expires-after \"$IMAGE_EXPIRES_AFTER\"\n  --build-args-file \"$BUILD_ARGS_FILE\"\n  --annotations-file \"$ANNOTATIONS_FILE\"\n  --legacy-build-timestamp \"$BUILD_TIMESTAMP\"\n  --add-legacy-labels\n  --include-legacy-buildinfo-path=\"$ICM_KEEP_COMPAT_LOCATION\"\n  --skip-injections=\"$SKIP_INJECTIONS\"\n  --skip-unused-stages=\"$SKIP_UNUSED_STAGES\"\n  --hermetic=\"$HERMETIC\"\n  --image-pull-proxy \"$BUILDAH_HTTP_PROXY\"\n  --image-pull-noproxy \"$BUILDAH_NO_PROXY\"\n  --yum-repos-d-sources \"${yum_repos_d_sources[@]}\"\n  --yum-repos-d-target \"$YUM_REPOS_D_TARGET\"\n  --prefetch-dir \"$prefetch_dir\"\n  --prefetch-dir-copy \"$prefetch_dir_copy\"\n  --prefetch-env-mount /cachi2/cachi2.env\n  --prefetch-output-mount /cachi2/output\n  \"${security_args[@]}\"\n  \"${rhsm_args[@]}\"\n  --containerfile-json-output /shared/parsed_dockerfile.json\n  --resolved-base-images-output /shared/base_images_digests\n  --no-cache\n  --ulimits nofile=4096:4096\n  --src-tls-verify=\"$TLSVERIFY\"\n  --dest-tls-verify=\"$TLSVERIFY\"\n  --allow-cross-platform-images=\"$ALLOW_CROSS_PLATFORM_IMAGES\"\n  \"$@\" # --annotations, --labels, --envs, --build-args\n)\n\necho \"[$(date --utc -Ins)] $(printf '%q ' \"${cmd[@]}\")\"\n\n\"${cmd[@]}\"\n\necho \"[$(date --utc -Ins)] Add metadata\"\n\n# Save the SBOM produced in prefetch so it can be merged into the final SBOM later\nif [ -f \"${prefetch_dir}/output/bom.json\" ]; then\n  echo \"Making copy of sbom-prefetch.json\"\n  cp \"${prefetch_dir}/output/bom.json\" ./sbom-prefetch.json\nfi\n\nimage_name=$(echo \"${IMAGE##*/}\" | tr ':' '-')\nbuildah push \"$IMAGE\" oci:\"/shared/$image_name.oci:$IMAGE\"\necho \"/shared/$image_name.oci\" >/shared/container_path\n\necho \"[$(date --utc -Ins)] End build\"\n"
    securityContext:
      capabilities:
        add:
        - SETFCAP
      runAsUser: 0
      privileged: true
    volumeMounts:
    - mountPath: /var/lib/containers
      name: varlibcontainers
    - mountPath: /entitlement
      name: etc-pki-entitlement
    - mountPath: /activation-key
      name: activation-key
    - mountPath: /additional-secret
      name: additional-secret
    - mountPath: /mnt/trusted-ca
      name: trusted-ca
      readOnly: true
    - mountPath: /mnt/proxy-ca-bundle
      name: proxy-ca-bundle
      readOnly: true
    workingDir: /var/workdir
  - computeResources:
      limits:
        cpu: 100m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 256Mi
    env:
    - name: HOME
      value: /root
    - name: BUILDAH_FORMAT
      value: docker
    - name: TASKRUN_NAME
      value: testrepo-on-pull-request-thhh4-build-container
    image: quay.io/konflux-ci/konflux-build-cli:latest@sha256:0415613f955ef8f7c6fc821a6738dcf062d9a3582441042b87a2391c375d7f54
    name: push
    script: "#!/bin/bash\nset -euo pipefail\n\necho \"[$(date --utc -Ins)] Update CA trust\"\n\nca_bundle=/mnt/trusted-ca/ca-bundle.crt\nif [ -f \"$ca_bundle\" ]; then\n  echo \"INFO: Using mounted CA bundle: $ca_bundle\"\n  cp -vf $ca_bundle /etc/pki/ca-trust/source/anchors\n  update-ca-trust\nfi\n\necho \"[$(date --utc -Ins)] Convert image\"\n\n# While we can build images with the desired format, we will simplify any local\n# and remote build differences by just performing any necessary conversions at\n# push time.\npush_format=oci\nif [ \"${BUILDAH_FORMAT}\" == \"docker\" ]; then\n  push_format=docker\nfi\n\necho \"[$(date --utc -Ins)] Push image with unique tag\"\n\nbuildah_retries=3\n\n# Push to a unique tag based on the TaskRun name to avoid race conditions\necho \"Pushing to ${IMAGE%:*}:${TASKRUN_NAME}\"\nif ! retry buildah push \\\n  --format=\"$push_format\" \\\n  --retry \"$buildah_retries\" \\\n  --tls-verify=\"$TLSVERIFY\" \\\n  \"$IMAGE\" \\\n  \"docker://${IMAGE%:*}:${TASKRUN_NAME}\"; then\n  echo \"Failed to push image to ${IMAGE%:*}:${TASKRUN_NAME}\"\n  exit 1\nfi\n\necho \"[$(date --utc -Ins)] Push image with git revision\"\n\n# Push to a tag based on the git revision\necho \"Pushing to ${IMAGE}\"\nif ! retry buildah push \\\n  --format=\"$push_format\" \\\n  --retry \"$buildah_retries\" \\\n  --tls-verify=\"$TLSVERIFY\" \\\n  --digestfile \"/var/workdir/image-digest\" \"$IMAGE\" \\\n  \"docker://$IMAGE\"; then\n  echo \"Failed to push image to $IMAGE\"\n  exit 1\nfi\n\ntee \"/tekton/results/IMAGE_DIGEST\" <\"/var/workdir\"/image-digest\necho -n \"$IMAGE\" | tee /tekton/results/IMAGE_URL\n{\n  echo -n \"${IMAGE}@\"\n  cat \"/var/workdir/image-digest\"\n} >\"/tekton/results/IMAGE_REF\"\necho\n\n# detect if keyless signing is required\nSIGNING_CONFIG='{}'\nKFLX_CONFIG_PATH='/tmp/konflux_config.json'\nif ! RETRY_STOP_IF_STDERR_MATCHES='configmaps \"cluster-config\" not found' retry kubectl get configmap cluster-config -n konflux-info -o json >\"${KFLX_CONFIG_PATH}\"; then\n  echo \"Failed to fetch konflux cluster-config, default values will be used\" >&2\nelse\n  SIGNING_CONFIG=\"$(cat ${KFLX_CONFIG_PATH})\"\nfi\n\n# configmap key -> variable name mapping\ndeclare -A SIGNING_KEY_MAP=(\n   [defaultOIDCIssuer]=SIGSTORE_OIDC_ISSUER\n   [rekorInternalUrl]=REKOR_URL\n   [fulcioInternalUrl]=SIGSTORE_FULCIO_URL\n   [tufInternalUrl]=TUF_URL\n)\n\n# fallback keys when internal URL is not available\ndeclare -A SIGNING_FALLBACK_MAP=(\n   [rekorInternalUrl]=rekorExternalUrl\n   [fulcioInternalUrl]=fulcioExternalUrl\n   [tufInternalUrl]=tufExternalUrl\n)\n\nmissing=\"\"\nconfigured=0\nfor key in \"${!SIGNING_KEY_MAP[@]}\"; do\n  val=$(echo \"${SIGNING_CONFIG}\" | jq -r \".data.${key} // empty\")\n  if [ -z \"${val}\" ] && [ -n \"${SIGNING_FALLBACK_MAP[$key]+x}\" ]; then\n    fallback_key=\"${SIGNING_FALLBACK_MAP[$key]}\"\n    val=$(echo \"${SIGNING_CONFIG}\" | jq -r \".data.${fallback_key} // empty\")\n    if [ -n \"${val}\" ]; then\n      echo \"Using fallback ${fallback_key} instead of ${key}\"\n    fi\n  fi\n  if [ -z \"${val}\" ]; then\n    missing=\"${missing:+${missing}, }${key}\"\n  else\n    declare \"${SIGNING_KEY_MAP[$key]}=${val}\"\n    configured=$((configured + 1))\n  fi\ndone\n\nif [ \"${configured}\" -eq \"${#SIGNING_KEY_MAP[@]}\" ]; then\n  echo \"Keyless signing is enabled\"\n\n  # Save signing config for upload-sbom step\n  for key in \"${!SIGNING_KEY_MAP[@]}\"; do\n    envvar=\"${SIGNING_KEY_MAP[$key]}\"\n    printf '%s=%q\\n' \"${envvar}\" \"${!envvar}\"\n  done >/shared/signing-config.env\n\n  echo \"Using Rekor URL: ${REKOR_URL}\"\n  echo \"Using Fulcio URL: ${SIGSTORE_FULCIO_URL}\"\n  echo \"Using OIDC issuer: ${SIGSTORE_OIDC_ISSUER}\"\n\n  echo \"Initializing TUF root from ${TUF_URL}\"\n  if ! retry cosign initialize --root \"${TUF_URL}/root.json\" --mirror \"${TUF_URL}\"; then\n    echo \"Failed to initialize TUF root\" >&2\n    exit 1\n  fi\n\n  # env var consumed by cosign\n  SIGSTORE_ID_TOKEN=\"$(cat /var/run/sigstore/cosign/oidc-token)\"\n  export SIGSTORE_ID_TOKEN\n\n  IMAGE_REF=\"$(cat \"/tekton/results/IMAGE_REF\")\"\n\n  # Pre-select the correct credentials to work around cosign not supporting the containers-auth.json spec\n  mkdir -p /tmp/auth && select-oci-auth \"${IMAGE_REF}\" >/tmp/auth/config.json\n  export DOCKER_CONFIG=/tmp/auth\n\n  echo \"[$(date --utc -Ins)] Sign image\"\n  echo \"Signing image ${IMAGE_REF} using keyless signing\"\n  if ! retry cosign sign -y \\\n    --rekor-url=\"${REKOR_URL}\" \\\n    --fulcio-url=\"${SIGSTORE_FULCIO_URL}\" \\\n    --oidc-issuer=\"${SIGSTORE_OIDC_ISSUER}\" \\\n    \"${IMAGE_REF}\"; then\n    echo \"Failed to sign image\" >&2\n    exit 1\n  fi\nelif [ \"${configured}\" -eq 0 ]; then\n  echo \"Keyless signing is disabled (none of ${missing} are configured in the konflux-info/cluster-config configmap)\"\nelse\n  echo \"ERROR: Incomplete keyless signing configuration in konflux-info/cluster-config configmap. Missing: ${missing}\" >&2\n  exit 1\nfi\n\necho \"[$(date --utc -Ins)] End push\"\n"
    securityContext:
      capabilities:
        add:
        - SETFCAP
      runAsUser: 0
      privileged: true
    volumeMounts:
    - mountPath: /var/lib/containers
      name: varlibcontainers
    - mountPath: /mnt/trusted-ca
      name: trusted-ca
      readOnly: true
    - mountPath: /var/run/sigstore/cosign
      name: oidc-token
      readOnly: true
    workingDir: /var/workdir
  - computeResources:
      limits:
        cpu: 256m
